name: MA200 Backtest Fast Chinese Data

on:
  push:
    paths:
      - '.github/workflows/ma200_backtest_fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Create fast script without external name lookups
        shell: python
        run: |
          from pathlib import Path
          source = Path('chatgpt_ma200_20260903.py').read_text(encoding='utf-8')
          old = "zh_map[row.股票代码] = wikidata_zh_name(row.英文公司名称, row.股票代码)"
          new = "zh_map[row.股票代码] = MANUAL_ZH.get(row.股票代码, f'股票代码{row.股票代码}')"
          if old not in source:
              raise SystemExit('Replacement target not found')
          Path('chatgpt_ma200_fast.py').write_text(source.replace(old, new), encoding='utf-8')

      - name: Run fast MA200 backtest
        run: python chatgpt_ma200_fast.py

      - name: Upload fast Chinese backtest data
        uses: actions/upload-artifact@v4
        with:
          name: ma200-backtest-fast
          path: ma200_output/
          if-no-files-found: error
          retention-days: 3
