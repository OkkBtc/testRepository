name: MA200 Backtest Chinese Data

on:
  push:
    paths:
      - '.github/workflows/ma200_backtest.yml'
      - 'chatgpt_ma200_20260903.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Run MA200 backtest
        run: python chatgpt_ma200_20260903.py

      - name: Upload Chinese backtest data
        uses: actions/upload-artifact@v4
        with:
          name: ma200-backtest-zh
          path: ma200_output/
          if-no-files-found: error
          retention-days: 3
